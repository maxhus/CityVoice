<!DOCTYPE html>
<html>
<head>
    <title>Debug Auth - CityVoice</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .info { background: #f0f0f0; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔍 Debug Authentification CityVoice</h1>
    
    <div class="info">
        <h3>État du localStorage:</h3>
        <div id="localStorage-info"></div>
    </div>

    <div class="info">
        <h3>Test de connexion:</h3>
        <input type="email" id="email" placeholder="Email" value="test@voice.com" style="padding: 8px; margin: 5px;">
        <input type="password" id="password" placeholder="Mot de passe" value="azerty" style="padding: 8px; margin: 5px;">
        <button onclick="testLogin()" style="padding: 8px 15px; margin: 5px;">Tester Connexion</button>
    </div>

    <div class="info">
        <h3>Test de création signalement:</h3>
        <button onclick="testCreateSignalement()" style="padding: 8px 15px;">Créer un signalement test</button>
    </div>

    <div id="results"></div>

    <script>
        // Afficher le contenu du localStorage
        function displayLocalStorage() {
            const token = localStorage.getItem('token');
            const user = localStorage.getItem('user');
            
            let html = '<strong>Token:</strong> ';
            if (token) {
                html += `<span class="success">✓ Présent (${token.substring(0, 20)}...)</span>`;
            } else {
                html += '<span class="error">✗ Absent</span>';
            }
            
            html += '<br><strong>User:</strong> ';
            if (user) {
                html += `<span class="success">✓ Présent</span><pre>${user}</pre>`;
            } else {
                html += '<span class="error">✗ Absent</span>';
            }
            
            document.getElementById('localStorage-info').innerHTML = html;
        }

        // Test de connexion
        async function testLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('http://localhost:5000/api/citoyens/connexion', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email_citoyen: email,
                        mot_de_passe_citoyen: password
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.data));
                    showResult('Connexion réussie!', 'success');
                    displayLocalStorage();
                } else {
                    showResult('Erreur: ' + data.message, 'error');
                }
            } catch (error) {
                showResult('Erreur: ' + error.message, 'error');
            }
        }

        // Test de création de signalement
        async function testCreateSignalement() {
            const token = localStorage.getItem('token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            
            if (!token) {
                showResult('Erreur: Pas de token. Connectez-vous d\'abord!', 'error');
                return;
            }
            
            try {
                const response = await fetch('http://localhost:5000/api/signalements', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        titre: 'Test de signalement',
                        description: 'Ceci est un test depuis le debugger',
                        categorie: 'Voirie',
                        latitude: 48.8566,
                        longitude: 2.3522,
                        adresse: '123 rue Test',
                        quartier: 'Centre',
                        id_citoyen: user.id_citoyen
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showResult('Signalement créé avec succès!<pre>' + JSON.stringify(data, null, 2) + '</pre>', 'success');
                } else {
                    showResult('Erreur: ' + data.message + '<pre>' + JSON.stringify(data, null, 2) + '</pre>', 'error');
                }
            } catch (error) {
                showResult('Erreur: ' + error.message, 'error');
            }
        }

        function showResult(message, type) {
            const div = document.createElement('div');
            div.className = 'info ' + type;
            div.innerHTML = '<h3>Résultat:</h3>' + message;
            document.getElementById('results').innerHTML = '';
            document.getElementById('results').appendChild(div);
        }

        // Afficher l'état au chargement
        displayLocalStorage();
    </script>
</body>
</html>
